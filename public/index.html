<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
  <script>
    // 화면 모드 before first paint (app.js keeps it up to date): data-theme and the status bar colour.
    try {
      var t = localStorage.getItem('herdr-hub.theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.dataset.theme = t;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#161614' : '#f6f5f1'; });
      }
    } catch (e) {}
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Herdr Hub">
  <title>Herdr Hub</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
